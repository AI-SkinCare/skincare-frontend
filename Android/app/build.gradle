plugins { id 'com.android.application' version '8.7.3' }

def backendUrl = providers.gradleProperty('springBaseUrl').orElse('').get()
if (backendUrl) {
    URI endpoint = URI.create(backendUrl)
    if (endpoint.scheme != 'https' || !endpoint.host || endpoint.userInfo || endpoint.query ||
        endpoint.fragment || endpoint.path != '/api/v1') {
        throw new GradleException('springBaseUrl must be an HTTPS Spring URL ending in /api/v1')
    }
}
dependencies {
    androidTestCompileOnly files(android.sdkDirectory.toPath().resolve('platforms/android-35/optional/android.test.runner.jar').toFile(),
                                 android.sdkDirectory.toPath().resolve('platforms/android-35/optional/android.test.base.jar').toFile())
}
android {
    namespace 'com.aiskincare.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.aiskincare.mobile'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    buildFeatures { buildConfig true }
    sourceSets.main.assets.srcDirs += ['../../SkinCare/Resources/Fonts',
                                       '../../SkinCare/Resources/Assets.xcassets/BrandMark.imageset']
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            buildConfigField 'String', 'SPRING_URL', groovy.json.JsonOutput.toJson(backendUrl ?: 'http://10.0.2.2:3000/api/v1')
        }
        release {
            buildConfigField 'String', 'SPRING_URL', groovy.json.JsonOutput.toJson(backendUrl)
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
