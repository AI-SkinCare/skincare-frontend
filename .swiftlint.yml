included:
  - SkinCare
  - SkinCareTests

line_length:
  # 한글 문구·SwiftUI 체이닝을 고려해 140 (패치 문서 §4.3)
  warning: 140
  error: 180
  ignores_urls: true
  ignores_comments: true

type_body_length:
  warning: 300
file_length:
  warning: 500
identifier_name:
  # 디자인 토큰(Spacing.xs 등)과 API 이름(me)
  excluded: [id, x, y, xs, sm, md, lg, xl, me]
type_name:
  excluded: [Me]
nesting:
  type_level: 2

disabled_rules:
  - trailing_comma
  - todo

opt_in_rules:
  - force_unwrapping
  - empty_count
  - sorted_imports

custom_rules:
  no_hex_color_in_views:
    name: "디자인 토큰 사용"
    message: "화면 코드에서 Color(hex:)를 직접 쓰지 말고 DesignSystem/Colors.swift 토큰을 쓰세요."
    included: "SkinCare/Features/.*"
    regex: "Color\\(hex:"
    severity: warning
